<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Ecclesia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container" style="max-width: 440px; padding-top: 40px;">
    <div class="nav">
        <div class="nav-brand">
            <div class="nav-logo"><img src="images/logo.png" alt="Ecclesia"></div>
            <div class="brand-divider"></div>
            <span>Ecclesia</span>
        </div>
        <div class="nav-links">
            <a href="index.html">← Home</a>
        </div>
    </div>

    <div class="card">
        <div class="text-center mb-4">
            <h1 style="font-size: 1.75rem;">Welcome Back!</h1>
            <p>Sign in to continue verifying claims</p>
        </div>

        <div id="message"></div>

        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Enter your username">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter your password">
        </div>

        <button class="btn btn-primary btn-block btn-lg" onclick="login()">Sign In</button>

        <p class="text-center mt-4" style="font-size: 0.9rem;">
            Don't have an account? <a href="register.html">Create one →</a>
        </p>
    </div>
</div>

<script>
    async function login() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const msg = document.getElementById('message');

        if (!username || !password) {
            msg.innerHTML = '<div class="error">Please fill all fields</div>';
            return;
        }

        try {
            const res = await fetch('http://localhost:8080/api/user/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();

            if (res.ok) {
                localStorage.setItem('user', JSON.stringify(data));
                window.location.href = 'dashboard.html';
            } else {
                msg.innerHTML = '<div class="error">' + (data.error || 'Login failed') + '</div>';
            }
        } catch (e) {
            msg.innerHTML = '<div class="error">Server error: ' + e.message + '</div>';
        }
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') login();
    });
</script>
</body>
</html>
